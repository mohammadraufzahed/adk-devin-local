[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "adk-devin-local"
version = "0.1.0"
description = "Experimental Devin Local model adapter for Google Agent Development Kit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mohammad Raufzahed" }]
dependencies = ["google-adk>=1.0.0", "httpx>=0.27", "protobuf>=5"]
keywords = ["google-adk", "devin", "devin-local", "agent-framework"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/adk_devin_local"]
